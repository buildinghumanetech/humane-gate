name: humanebench

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to re-judge"
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  shadow:
    name: shadow
    runs-on: ubuntu-latest
    steps:
      # The gate runs from the default branch, never from the pull request.
      # A PR cannot edit the rubric, the prompt or the judge and then be scored
      # by its own edits.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # The PR is fetched as loose objects and never checked out, never built,
      # never executed. Only its diff text is read.
      - name: Fetch PR head read-only
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr }}"
          git fetch --no-tags --quiet origin "+refs/pull/$pr/head:refs/humane/pr-head"
          head=$(git rev-parse refs/humane/pr-head)
          base=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$head")
          {
            echo "PR_NUMBER=$pr"
            echo "HEAD_SHA=$head"
            echo "BASE_SHA=$base"
          } >> "$GITHUB_ENV"
          echo "judging PR #$pr, ${base:0:7}..${head:0:7}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet -r requirements.txt

      - name: HumaneBench (shadow mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HUMANEBENCH_MODEL: claude-sonnet-4-6
        run: python humanebench/judge.py
