name: humanebench

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:          # lets you re-run it live on a call

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  shadow:
    name: shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # needed for the merge-base diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet anthropic requests

      - name: HumaneBench (shadow mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HUMANEBENCH_MODEL: claude-sonnet-4-6
        run: python humanebench/judge.py
