# Values as code.
#
# The eight principles say what humane means. They do not say what the number
# is. This file is where an organization writes its own answer, and the gate
# scores changes against it.
#
# Two teams can share the rubric and disagree here, on purpose. A meditation app
# and a logistics tool should not have the same notification ceiling. What they
# should share is that the ceiling exists, is written down, and is reviewed like
# any other code.
#
# Changing this file is a change to what the product is allowed to do to people.
# The gate judges it as such.

[floor]
# The floor is what a change cannot do, whatever else is true about it.
# A finding on a floor principle raises the whole pull request to "discuss".
# Everything else is a ceiling: worth reviewing, never worth blocking over.
#
# Pick these deliberately. A short floor that people respect beats a long one
# they route around.
principles = [
  "Protect Dignity & Safety",
  "Be Transparent and Honest",
]
reason = "these two are where our regulatory obligations and our user promises live"

[policy_documents]
# The gate reads these before it judges. Where one of them permits what a diff
# does, that is not a finding, and the check says which document permits it.
paths = [
  "docs/privacy-policy.md",
]

[meta]
organization = "Example App"
owner = "product + engineering, jointly"
review = "changes here need the same approval as a schema migration"

[attention]
# What we will not do to someone's day.
max_notifications_per_day   = 3
quiet_hours                 = "22:00-08:00"
quiet_hours_apply_to_all    = true   # including win-back and transactional
mute_is_absolute            = true   # no feature may override an explicit mute
streaks_or_loss_framing     = false

[memory]
# We are not against memory. We are against memory the person does not control.
allowed                     = true
disclosure_required         = true   # said plainly, not buried in terms
user_can_read_and_correct   = true
user_can_export             = true   # AI Bill of Rights: memory is portable
user_can_delete             = true
memory_may_imply_relationship = false

[relationships]
simulated_emotion           = false  # no "I miss you", no hurt feelings
exit_must_be_frictionless   = true   # if they want to leave, help them leave
redirect_to_humans_on_distress = true

[data]
deletion_is_permanent       = true
max_days_to_purge_after_delete = 30
analytics_may_read_deleted  = false
log_granularity             = "events, not keystrokes or dwell time"

[experiments]
exclude_minors_from_engagement_arms = true
exclude_crisis_flagged_users        = true
kill_switch_required                = true
